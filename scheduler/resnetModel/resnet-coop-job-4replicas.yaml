apiVersion: batch/v1
kind: Job
metadata:
  name: resnet50-coop-job
  namespace: odm-gpu
spec:
  completions: 4
  parallelism: 4
  backoffLimit: 0
  ttlSecondsAfterFinished: 300

  template:
    metadata:
      labels:
        app: resnet50-coop-client

    spec:
      restartPolicy: Never

      # IMPORTANT: we rely on NVIDIA time-slicing, NOT Kubernetes GPU scheduling
      nodeSelector:
        nvidia.com/gpu.present: "true"

      containers:
        - name: resnet50-coop
          image: docker.io/library/resnet50-coop:v2
          imagePullPolicy: IfNotPresent

          env:
            - name: SCHEDULER_URL
              value: "http://gpu-scheduler.default.svc.cluster.local:8080"

            - name: SLICE_STEPS
              value: "50"

            - name: MAX_STEPS
              value: "200"

            - name: BATCH_SIZE
              value: "8"

            - name: CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: PRIORITY
              value: "10"

            - name: CHECKPOINT_DIR
              value: "/mnt/checkpoints"

          volumeMounts:
            - name: checkpoints
              mountPath: /mnt/checkpoints

      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: odm-checkpoints
