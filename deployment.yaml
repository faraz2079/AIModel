apiVersion: v1
kind: Namespace
metadata:
  name: odm-gpu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolov8n-gpu
  namespace: odm-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolov8n-gpu
  template:
    metadata:
      labels:
        app: yolov8n-gpu
    spec:
      containers:
        - name: yolov8n
          image: ghcr.io/faraz2079/yolov8n-gpu-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: yolov8n-gpu-svc
  namespace: odm-gpu
spec:
  selector:
    app: yolov8n-gpu
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
